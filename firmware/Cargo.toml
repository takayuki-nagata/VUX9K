[workspace]
members = ["boot_manager", "resident_loader", "fw_common"]
resolver = "2"

[profile.dev]
panic = "abort"
opt-level = "z"

[profile.release]
panic = "abort"
lto = true
opt-level = "z"
codegen-units = 1

# The release code plus DWARF line tables, for coverage (make coverage-fw checks that
# the code is byte-identical to the release image before using it)
[profile.coverage]
inherits = "release"
debug = "line-tables-only"
