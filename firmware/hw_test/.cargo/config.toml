[build]
target = "riscv32i-unknown-none-elf"

# Same memory layout as the Boot Manager (it replaces it in firmware.hex). The path is
# relative to the workspace root (docs/agents/firmware.md, "Cargo workspace gotcha").
[target.riscv32i-unknown-none-elf]
rustflags = [
    "-C", "link-arg=-Tboot_manager/bootstrap/link.x",
]
