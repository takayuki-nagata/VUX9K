[package]
name = "fw_common"
version = "0.1.0"
edition = "2021"
authors = ["Takayuki Nagata"]
license = "MIT"
description = "Hardware-independent firmware logic (FAT32, file header, transfer, boot), tested on the host"

[features]
# fat::write and fat::stage2::install: the writes an update of the second stage needs
fat-write = []

[dependencies]

# fw_common::fat on an image file (sim/emu/test_fat_images.py)
[[example]]
name = "fat_host"
required-features = ["fat-write"]
