[package]
name = "vux9k_emu_py"
description = "Python bindings of the VUX9K emulator (pyo3, abi3)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

# Built with plain `cargo build` (no maturin) and copied to
# build/emu/python/vux9k_emu.abi3.so by `make emu-py`.
[lib]
name = "vux9k_emu"
crate-type = ["cdylib"]

[dependencies]
# Renamed: this cdylib itself is named vux9k_emu (the Python module name)
emu_core = { package = "vux9k_emu", path = "../vux9k_emu" }
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"] }
