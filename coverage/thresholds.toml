# Coverage minimums (percent). Raise them as tests are added; never lower one to make
# a failing run pass.
#
# Firmware lines, from the emulator tests (make coverage-fw, scripts/coverage_fw.py).
# Lines that can't run by design carry a `cov:exclude(reason)` comment instead.
# hack_demo: the rest is its [FAIL] reporting, reached only if a self-test fails.
[line]
# The two stages. stage2's 7 lines left: fw_common lines the second stage can't reach (create's
# Exists after its callers removed the name, list on a file, a read-back that differs: the
# emulator's card has no such fault), loop ends the line table puts on a `}` or a fn line, and
# SdCard::init's 1000 tries of a card that never gets ready (~2G cycles from the PSRAM)
stage1 = 100.0
stage2 = 99.1
zephyr_demo = 100.0
hack_demo = 90.0

# Functional coverage of the unit tests: cover groups (sim/unit/fcov.py), from the
# fixed-seed sim-unit run (make coverage-fcov, scripts/fcov_report.py). A bin the
# stimulus can't reach gets a directed case, not a lower minimum.
[fcov]
alu = 100.0
csrs = 100.0
decode = 100.0
fifo = 100.0
lsu = 100.0
npc = 100.0
psram = 100.0
sd = 100.0
stall = 100.0
trap = 100.0
uart_rx = 100.0
xbridge = 100.0

# Host Rust lines (make coverage-rust, scripts/coverage_rust.py, cargo-llvm-cov): the
# emulator from its cargo tests plus the Python-driven runs of an instrumented build
# (sim/emu, riscv-tests and ACT4 on the emu backend); fw_common from its host tests.
# There is no exclusion comment on stable Rust (#[coverage(off)] is nightly-only), so a
# minimum below 100 stands for what is known not to run.
[rust]
vux9k_emu = 95.0
vux9k_emu_cli = 72.4
vux9k_emu_py = 70.5
fw_common = 99.8
