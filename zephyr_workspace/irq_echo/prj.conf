# Interrupt-driven UART echo for the real board (-b vux9k): it must fit in the 14 KB of
# I-RAM below the Resident Loader and 8 KB of D-RAM, like the Rust demo (app/prj.conf).
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# All output goes through the interrupt-driven API: printk's formatter alone is 1.5 KB
CONFIG_PRINTK=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_BOOT_BANNER=n

CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_MINIMAL_LIBC=y
CONFIG_EXCEPTION_DEBUG=n
CONFIG_TIMESLICING=n
CONFIG_HEAP_MEM_POOL_SIZE=0
CONFIG_ERRNO=n

CONFIG_MAIN_STACK_SIZE=1024
CONFIG_IDLE_STACK_SIZE=256
CONFIG_ISR_STACK_SIZE=512
