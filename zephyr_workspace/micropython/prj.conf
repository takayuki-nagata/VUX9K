# MicroPython's Zephyr port for the real board (-b vux9k), in place of the port's own
# prj.conf (make build-micropython: -DCONF_FILE). Based on that prj.conf (v1.29.0), the
# port's full configuration (mpconfigport.h: the time module, arbitrary-precision integers;
# prj_minimal.conf's has neither), less what the board doesn't have: networking, a
# watchdog, an FPU (the SoC is rv32i), a reboot driver.
# CONFIG_MICROPY_CONFIGFILE is mpconfigport_vux9k.h (make build-micropython): mpconfigport.h
# less the zsensor module
# The extra features: f-strings, re, sys.stdin's files, math.factorial (bc_clone_py)
CONFIG_MICROPY_CONFIG_ROM_LEVEL_EXTRA_FEATURES=y
# Frozen modules: bc_clone_py (CONFIG_MICROPY_FROZEN_MANIFEST is manifest.py, make
# build-micropython). Its parser and evaluator recurse on the C stack: a main stack well over
# the port's 4736 B
CONFIG_MICROPY_FROZEN_MODULES=y
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_POLL=y
CONFIG_DEVICE_DT_METADATA=y

# The REPL on the console UART through the UART console's input hook (the port's
# src/zephyr_getchar.c): it sees Ctrl-C in the RX interrupt, so Ctrl-C stops a running
# program, and output is uart_poll_out, not the driver's TX interrupt (a k_timer here,
# docs/agents/zephyr.md)
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_CONSOLE_HANDLER=y
CONFIG_UART_CONSOLE_DEBUG_SERVER_HOOKS=y

# The board's RAM is 3 MB (vux9k.dts): a larger heap than the port's default (bc_clone_py's
# self-test peaked at ~43 KB on a 64-bit host)
CONFIG_MICROPY_HEAP_SIZE=262144

CONFIG_LEGACY_GENERATED_INCLUDE_PATH=n
