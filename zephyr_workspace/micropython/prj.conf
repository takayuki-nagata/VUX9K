# MicroPython's Zephyr port for the real board (-b vux9k), in place of the port's own
# prj.conf (make build-micropython: -DCONF_FILE). Based on the port's prj_minimal.conf
# (v1.29.0) less CONFIG_FPU (the SoC is rv32i: no FPU to select) and with another console
# path (below). Integers are the minimal config's long long, not arbitrary precision.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_POLL=y

# The REPL on the console UART through the UART console's input hook (the port's
# src/zephyr_getchar.c, as in its full prj.conf), not prj_minimal's console subsystem: the
# hook sees Ctrl-C in the RX interrupt, so it stops a running program (the subsystem's tty
# only reads when the REPL asks for a character), and output is uart_poll_out, not the
# driver's TX interrupt (a k_timer here, docs/agents/zephyr.md)
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE_HANDLER=y
CONFIG_UART_CONSOLE_DEBUG_SERVER_HOOKS=y

# The board's RAM is 3 MB (vux9k.dts): a larger heap than the minimal 16 KB
CONFIG_MICROPY_HEAP_SIZE=65536

CONFIG_LEGACY_GENERATED_INCLUDE_PATH=n
