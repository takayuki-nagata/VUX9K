description: |
  The VUX9K's machine external interrupt (mcause 11) as a two-cell interrupt controller, so
  that drivers which read a priority cell (litex,uart0) can name it. No driver: without
  CONFIG_MULTI_LEVEL_INTERRUPTS the irq cell is the RISC-V interrupt number itself.

compatible: "vux9k,meip-intc"

include: [interrupt-controller.yaml, base.yaml]

properties:
  "#interrupt-cells":
    const: 2

interrupt-cells:
  - irq
  - priority
