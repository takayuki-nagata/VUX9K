# The Rust demo runs on the real board (-b vux9k): the whole image must fit in the
# 14 KB of I-RAM below the Resident Loader and 8 KB of D-RAM, which the linker
# enforces through the board's memory regions. These settings make it fit.
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_EARLY_CONSOLE=n
CONFIG_BOOT_BANNER=n

CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_MINIMAL_LIBC=y
CONFIG_CBPRINTF_NANO=y
CONFIG_EXCEPTION_DEBUG=n
CONFIG_TIMESLICING=n
CONFIG_HEAP_MEM_POOL_SIZE=0
CONFIG_ERRNO=n

CONFIG_MAIN_STACK_SIZE=1024
CONFIG_IDLE_STACK_SIZE=256
CONFIG_ISR_STACK_SIZE=512
