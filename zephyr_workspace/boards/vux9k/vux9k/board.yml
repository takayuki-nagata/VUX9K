# vux9k            the real SoC: 14 KB of I-RAM for the program and 8 KB of D-RAM less
#                  8 bytes (the old Resident Loader's limits, until PSRAM), 18 MHz
# vux9k/vux9k/ext  emulator only (vux9k-emu --profile extended): the same SoC with
#                  512 KB/256 KB of memory, for programs too big for the board (bc).
#                  It is NOT real hardware.
board:
  name: vux9k
  vendor: vux9k
  socs:
  - name: vux9k
    variants:
    - name: ext
