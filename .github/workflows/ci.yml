name: Tang Nano 9K Dual-ISA SoC CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  # Nightly + manual runs additionally execute `make test-slow` (see the step below)
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  test:
    name: SoC Verification & Test Suite
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup uv Python Environment
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.6"
          enable-cache: true
          # No uv.lock/requirements*.txt is tracked (the pins live in this file), so key
          # the uv cache on the workflow itself instead of the default glob matching nothing
          cache-dependency-glob: .github/workflows/ci.yml

      - name: Check No Hardcoded Absolute Paths
        run: python3 scripts/check_no_absolute_paths.py

      - name: Setup OSS CAD Suite (Yosys, Icarus, Verilator, etc.)
        uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          version: '2026-08-21'

      - name: Install Host Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu device-tree-compiler ninja-build

      - name: Install Rust Toolchain & Target
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"
          targets: riscv32i-unknown-none-elf

      - name: Cache Veryl Binary
        id: cache-veryl
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/veryl
          key: ${{ runner.os }}-veryl-v0.21.0-locked

      - name: Install Veryl
        if: steps.cache-veryl.outputs.cache-hit != 'true'
        # --locked: build with Veryl's own Cargo.lock, so a cache miss can't pick up newer
        # (possibly broken) dependency releases
        run: cargo install veryl --version 0.21.0 --locked

      - name: Cache MSP430 GCC Toolchain
        id: cache-msp430-gcc
        uses: actions/cache@v4
        with:
          path: ~/.local/msp430-gcc
          key: ${{ runner.os }}-msp430-gcc-9.3.1.11

      - name: Install Hack Toolchain (has, m2h & msp430-gcc)
        run: |
          mkdir -p ~/.local/bin
          TMP_DIR=$(mktemp -d)
          curl -sL https://github.com/takayuki-nagata/hack_tools/releases/download/v0.2.0/has-v0.2.0-linux-x86_64.tar.gz | tar -xz -C "$TMP_DIR"
          cp "$TMP_DIR"/has*/has ~/.local/bin/has
          chmod +x ~/.local/bin/has
          rm -rf "$TMP_DIR"
          if [ "${{ steps.cache-msp430-gcc.outputs.cache-hit }}" != "true" ]; then
            mkdir -p ~/.local/msp430-gcc
            curl -fsSL https://dr-download.ti.com/software-development/ide-configuration-compiler-or-debugger/MD-LlCjWuAbzH/9.3.1.2/msp430-gcc-9.3.1.11_linux64.tar.bz2 | tar -xjf - -C ~/.local/msp430-gcc --strip-components=1
          fi
          ln -sf ~/.local/msp430-gcc/bin/msp430-elf-gcc ~/.local/bin/msp430-gcc
          ln -sf ~/.local/msp430-gcc/bin/msp430-elf-gcc ~/.local/bin/msp430-elf-gcc
          echo "$HOME/.local/msp430-gcc/bin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Zephyr SDK & Workspace
        id: cache-zephyr
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/zephyr-sdk-0.16.8
            ~/zephyrproject
          key: ${{ runner.os }}-zephyr-sdk-0.16.8-riscv-v1

      - name: Install Zephyr Toolchain & West (if not cached)
        if: steps.cache-zephyr.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.local
          wget -q https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.16.8/zephyr-sdk-0.16.8_linux-x86_64_minimal.tar.xz
          tar -xf zephyr-sdk-0.16.8_linux-x86_64_minimal.tar.xz -C ~/.local/
          rm zephyr-sdk-0.16.8_linux-x86_64_minimal.tar.xz
          cd ~/.local/zephyr-sdk-0.16.8 && ./setup.sh -t riscv64-zephyr-elf -h -c
          uv tool run west init ~/zephyrproject -m https://github.com/zephyrproject-rtos/zephyr --mr v3.7.2
          cd ~/zephyrproject && uv tool run west update -n -o=--depth=1

      - name: Setup Python Virtualenv & Dependencies
        run: |
          uv python install 3.13
          uv venv --python 3.13 .venv
          uv pip install --python .venv/bin/python cocotb==2.0.1 pytest==9.1.1 ruff==0.16.8 mypy==2.4.0 cocotb-coverage==2.0 python-constraint==1.4.0 pyyaml==6.0.3 https://github.com/takayuki-nagata/hack_tools/releases/download/v0.2.0/m2h-0.2.0.tar.gz -r $HOME/zephyrproject/zephyr/scripts/requirements-base.txt

      # riscv-arch-test's ACT4 tests: generated with the upstream image (docker) only when
      # scripts/act4/ changed; make test-act4* (in test-sim) runs them
      - name: Cache the ACT4 Tests
        id: cache-act4
        uses: actions/cache@v4
        with:
          path: build/act4
          key: act4-${{ hashFiles('scripts/act4/generate.sh', 'scripts/act4/vux9k/**') }}

      - name: Generate the ACT4 Tests (riscv-arch-test, Sail reference results)
        if: steps.cache-act4.outputs.cache-hit != 'true'
        run: python3 scripts/act4/act4_elfs.py

      - name: Run Full SoC Simulation Suite (RTL, ISA & GLS)
        run: |
          export PATH=$PWD/.venv/bin:$HOME/.cargo/bin:$HOME/.local/bin:$HOME/.local/msp430-gcc/bin:$HOME/.local/zephyr-sdk-0.16.8/riscv64-zephyr-elf/bin:$PATH
          export ZEPHYR_BASE=$HOME/zephyrproject/zephyr
          export ZEPHYR_SDK_INSTALL_DIR=$HOME/.local/zephyr-sdk-0.16.8
          make test-sim

      - name: Run Slow Simulation Tier (GLS flashing flow, Icarus full flow)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          export PATH=$PWD/.venv/bin:$HOME/.cargo/bin:$HOME/.local/bin:$HOME/.local/msp430-gcc/bin:$HOME/.local/zephyr-sdk-0.16.8/riscv64-zephyr-elf/bin:$PATH
          make test-slow

      - name: Run Static Timing Analysis (STA & Physical Timing Closure)
        run: |
          export PATH=$PWD/.venv/bin:$HOME/.cargo/bin:$HOME/.local/bin:$HOME/.local/msp430-gcc/bin:$HOME/.local/zephyr-sdk-0.16.8/riscv64-zephyr-elf/bin:$PATH
          make sta

      - name: Build & Check the Application-Developer Distribution (make dist)
        run: |
          export PATH=$PWD/.venv/bin:$HOME/.cargo/bin:$HOME/.local/bin:$HOME/.local/msp430-gcc/bin:$HOME/.local/zephyr-sdk-0.16.8/riscv64-zephyr-elf/bin:$PATH
          export ZEPHYR_BASE=$HOME/zephyrproject/zephyr
          export ZEPHYR_SDK_INSTALL_DIR=$HOME/.local/zephyr-sdk-0.16.8
          make dist check-dist
          # One tarball: upload-artifact's zip would drop the emulator's executable bit
          tar -C build -czf build/vux9k-dist.tar.gz dist

      # A release candidate per push; release.yml publishes it once a tag vouches for it
      # (docs/RELEASING.md)
      - name: Upload the Distribution
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: vux9k-dist-${{ github.sha }}
          path: build/vux9k-dist.tar.gz
          retention-days: 90
          if-no-files-found: error

      - name: Check Submodule Cleanliness
        run: |
          if [ -n "$(git status --porcelain vendor/bc_clone_rs)" ]; then
            echo "Error: vendor/bc_clone_rs contains unexpected modifications!"
            git status --porcelain vendor/bc_clone_rs
            exit 1
          fi
          echo "Submodule vendor/bc_clone_rs is 100% clean."
