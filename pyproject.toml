# Tool configuration only: this repo's Python (testbenches, host tools, build
# scripts) is not an installable package. Dependencies are installed by
# `make setup` / CI.

[tool.ruff]
line-length = 120
target-version = "py313"
include = ["sim/**/*.py", "tools/**/*.py", "scripts/**/*.py", ".claude/hooks/*.py"]

[tool.ruff.lint]
# E/F: pycodestyle/pyflakes, I: import order, B: bugbear,
# ASYNC: blocking calls inside coroutines, RUF006: dangling asyncio tasks.
select = ["E", "F", "I", "B", "ASYNC", "RUF006"]

[tool.ruff.lint.per-file-ignores]
# cocotb coroutines aren't an asyncio event loop: the simulator is paused while
# Python runs, so blocking file I/O inside a test can't stall anything.
"sim/**/*.py" = ["ASYNC2"]

[tool.pytest.ini_options]
# cocotb testbenches run through sim/runners/test_sim.py; sim/unit and
# sim/integration hold cocotb (not pytest) modules and must not be collected.
testpaths = ["sim/runners", "sim/emu"]
cache_dir = "build/pytest_cache"
addopts = "--strict-markers"
markers = [
    "unit: single-module cocotb testbench",
    "soc: full soc_top cocotb testbench",
    "gls: gate-level simulation of a yosys netlist",
    "slow: takes many minutes; excluded from test-ci",
]

[tool.mypy]
python_version = "3.13"
files = ["sim", "tools", "scripts", ".claude/hooks"]
# No packages here: modules are found the way the tests find them (sim_runner and the
# tests put these directories on sys.path)
mypy_path = "sim/integration:sim/emu:sim/unit:sim/runners:scripts:scripts/riscv_tests:scripts/act4:scripts/mcy:.claude/hooks:."
explicit_package_bases = true
check_untyped_defs = true
warn_unused_ignores = true
cache_dir = "build/mypy_cache"

[[tool.mypy.overrides]]
# Untyped or optional: pyserial/pyftdi (vux_tool works without them), the emulator's
# pyo3 module (no stubs), pyelftools, cocotb-coverage, PyYAML
module = ["serial", "serial.*", "pyftdi", "pyftdi.*", "vux9k_emu", "elftools.*", "cocotb_coverage.*", "yaml"]
ignore_missing_imports = true
