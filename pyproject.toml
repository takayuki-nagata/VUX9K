# Tool configuration only: this repo's Python (testbenches, host tools, build
# scripts) is not an installable package. Dependencies are installed by
# `make setup` / CI.

[tool.ruff]
line-length = 120
target-version = "py313"
include = ["sim/**/*.py", "tools/**/*.py", "scripts/**/*.py"]

[tool.ruff.lint]
# E/F: pycodestyle/pyflakes, I: import order, B: bugbear,
# ASYNC: blocking calls inside coroutines, RUF006: dangling asyncio tasks.
select = ["E", "F", "I", "B", "ASYNC", "RUF006"]

[tool.ruff.lint.per-file-ignores]
# cocotb coroutines aren't an asyncio event loop: the simulator is paused while
# Python runs, so blocking file I/O inside a test can't stall anything.
"sim/**/*.py" = ["ASYNC2"]

[tool.pytest.ini_options]
# cocotb testbenches run through sim/runners/test_sim.py; sim/unit and
# sim/integration hold cocotb (not pytest) modules and must not be collected.
testpaths = ["sim/runners", "sim/emu"]
cache_dir = "build/pytest_cache"
addopts = "--strict-markers"
markers = [
    "unit: single-module cocotb testbench",
    "soc: full soc_top cocotb testbench",
    "gls: gate-level simulation of a yosys netlist",
    "slow: takes many minutes; excluded from test-ci",
]
